name: Build All Platforms

# 触发条件：push 到 master（Gitee 镜像同步到 GitHub 后自动触发），也可手动触发
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows：NSIS .exe + MSI
          - platform: 'windows-latest'
            args: ''
            name: windows
            pdfium-arch: x64
          # macOS Apple Silicon：原生编译
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            name: macos-arm64
            pdfium-arch: arm64
          # macOS Intel：交叉编译（macOS 上双架构均为官方支持）
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            name: macos-x64
            pdfium-arch: x64
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Pdfium 动态库不入库（.gitignore），构建前必须先下载；
      # macOS 交叉编译时目标架构 ≠ runner 主机架构，需按 matrix 指定
      - name: Download Pdfium library
        run: bash scripts/download_pdfium.sh ${{ matrix.pdfium-arch }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS 两个 target 都装上（原生 + 交叉编译各取所需）
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile

      # 前端单测（Vitest）
      - name: Run frontend tests
        run: yarn test

      # Rust 单测（cargo test）
      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # 构建并打包（tauri.conf.json 的 bundle.targets=all 自动产出各平台安装包）
      - name: Build & Bundle (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}

      # 上传安装包，可在 Actions 页面下载
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: docmorph-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: warn
