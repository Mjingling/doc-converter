name: Publish

# 触发条件：推送 v 开头的 tag（如 v0.1.0），自动构建、发布 GitHub Release 并更新 Gitee release 仓库
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
            name: windows
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            name: macos-arm64
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            name: macos-x64
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile

      - name: Build & Bundle (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'DocMorph v__VERSION__'
          releaseBody: |
            ## 安装说明

            - **Windows**: 下载 `*_x64-setup.exe`（NSIS 安装包）或 `*_x64_en-US.msi`（MSI 包）
            - **macOS Intel**: 下载 `*_x64.dmg`
            - **macOS Apple Silicon**: 下载 `*_aarch64.dmg`

            Windows 首次运行可能弹出 SmartScreen 提示，点击「更多信息 → 仍要运行」即可。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # 同时上传到 Actions artifact，方便调试时直接下载
      - name: Upload installers (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: docmorph-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: warn

  # 发布后自动更新 Gitee release 仓库的 version.json
  update-info:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Gitee release repo
        run: |
          git clone https://speed_turbo:${{ secrets.GITEE_TOKEN }}@gitee.com/speed_turbo/doc-converter-release.git /tmp/release-repo

      - name: Update version.json
        run: |
          cd /tmp/release-repo
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          cat > version.json <<'EOF'
          {
            "version": "VERSION_PLACEHOLDER",
            "notes": "请前往 GitHub Releases 查看更新说明",
            "download_url": "https://github.com/Mjingling/doc-converter/releases/tag/TAG_PLACEHOLDER"
          }
          EOF
          sed -i "s/VERSION_PLACEHOLDER/${VERSION}/g" version.json
          sed -i "s|TAG_PLACEHOLDER|${TAG}|g" version.json
          git config user.name "DocMorph CI"
          git config user.email "ci@docmorph.app"
          git add version.json
          git commit -m "chore: update version.json for ${TAG}" || echo "No changes"
          git push