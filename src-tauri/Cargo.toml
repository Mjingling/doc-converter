[package]
name = "doc-converter"
version = "0.2.0"
description = "DocMorph：办公文档转换与 PDF 工具箱"
license = "Apache-2.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lopdf = "0.34"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-store = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
notify = "6"
zip = "2"
quick-xml = "0.36"
md-5 = "0.10"
ttf-parser = "0.25"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp"] }
# PDF 逐页渲染（内置引擎）：动态加载 Pdfium，库文件由 scripts/download_pdfium.sh 下载
pdfium-render = { version = "0.8", default-features = false, features = ["pdfium_latest", "thread_safe", "sync", "image"] }
libc = "0.2"
ureq = { version = "2", features = ["json"] }
flate2 = "1"

# 网页渲染转 PDF：macOS 走 WKWebView printOperation（版本与 wry 依赖对齐，避免重复编译）
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSURL", "NSDictionary", "NSGeometry"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPrintInfo"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "WKWebView", "objc2-app-kit"] }

# 网页渲染转 PDF：Windows 走 WebView2 PrintToPdf
# windows 与 webview2-com 内部依赖同版本，仅取 core::HSTRING，feature 由 webview2-com 合并
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", default-features = false }

[profile.release]
strip = true
lto = true
codegen-units = 1

[lib]
name = "doc_converter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
